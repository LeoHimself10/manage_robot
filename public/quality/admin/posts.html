<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>质量岗位配置</title>
<style>body{margin:0;background:#f3f6fa;color:#183153;font:14px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1020px;margin:32px auto;padding:0 24px}h1{font-size:24px}h2{font-size:18px;margin:0}section{background:white;border:1px solid #dce5ef;border-radius:10px;padding:24px;margin:18px 0}button,input,select{font:inherit;min-height:42px;box-sizing:border-box;border:1px solid #b8cbe1;border-radius:6px;padding:8px 14px}button{cursor:pointer;background:#fff;color:#215ebe}button.primary{background:#245fc3;color:#fff}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0 5px}.muted{color:#62758f}#notice{min-height:28px;color:#a43922}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:230px}.results button{display:block;text-align:left;width:100%;margin-top:8px}dialog{border:1px solid #c6d3e4;border-radius:10px;max-width:520px;padding:24px}dialog::backdrop{background:#10284466}a{color:#245fc3}summary{cursor:pointer}li{margin:8px 0}</style>
<main><a href="../ma-workbench/">返回质量工作台</a><h1>质量岗位配置</h1><p class="muted">每个岗位一名负责人。更换后接手该岗位全部未完成工作，保留历史操作记录，部门主管与员工任务不改派。</p>
<label for="scope">配置范围</label><select id="scope"><option value="real">真实岗位</option><option value="test">测试岗位（禁止真实推送）</option></select><p class="muted">真实岗位决定本人钉钉登录后的权限；管理员切换测试视角使用测试岗位。两套配置独立保存。</p><div id="notice" role="status"></div><div id="posts"></div><section><details><summary>岗位变更记录</summary><ul id="history"></ul></details></section></main>
<dialog id="confirm"><h2>确认岗位交接</h2><p id="confirmText"></p><p>新人将接手该岗位全部未完成工作，原人员失去该岗位权限。已经发放的部门任务和历史记录保持不变。</p><div class="row"><button id="cancel">取消</button><button class="primary" id="save">确认更换并交接</button></div></dialog>
<script src="posts.js"></script></html>
