name: Agent Eval

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  eval-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run eval:unit

  eval-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: eval:release
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: npm run eval:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-release-summary
          path: .eval-release/eval-summary.json
