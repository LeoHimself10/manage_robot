<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OA 反馈工作台 · 马荣鑫</title><link rel="stylesheet" href="/ma-workbench/oa.css"></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">✓</span>任务规划与质量追踪</div><nav><a href="http://127.0.0.1:8797/workbench">任务工作台</a><span class="active">质量追踪</span></nav><div class="user"><span class="avatar">马</span><span>马荣鑫<small>主管 · 客户服务部</small></span><select id="perspective" aria-label="切换视角"><option value="ma">马荣鑫视角</option><option value="tong">佟成视角</option><option value="original">原系统视角切换</option></select></div></header>
<div class="connection-strip"><strong>钉钉 OA 反馈</strong><span>原始资料只读 · 人工决定是否通报 · AI 使用原系统模型</span><span class="local-label">本机接入</span></div>
<main class="container"><div class="breadcrumb">质量追踪 / 用服反馈流程</div><div class="page-header"><div><h1>反馈与处理工作台</h1><p class="subtitle">主管审批通过，流转到你的反馈会自动进入这里。</p></div><div class="header-actions"><div id="syncState" class="sync-state" role="status">正在连接 OA 数据源…</div><button class="btn" id="sync">立即同步</button></div></div>
<div id="error" class="notice error" role="alert" hidden></div>
<section class="panel setup" id="setup" hidden><h2>连接用服反馈流程</h2><p class="muted">使用“ai任务规划助手”的应用凭证。凭证仅保存在本机服务端。</p><form id="credentials"><label>Client ID<input id="clientId" autocomplete="off" required></label><label>Client Secret<input id="clientSecret" type="password" autocomplete="off" required></label><button class="btn primary" type="submit">验证并接入 OA</button><span id="setupState" role="status"></span></form></section>
<section class="panel" id="inbox"><div class="list-top"><div class="tabs" role="tablist"><button class="tab" data-scope="pending" aria-selected="true">待我研判 <span id="pendingCount" class="count">0</span></button><button class="tab" data-scope="all" aria-selected="false">全部已导入 <span id="allCount" class="count">0</span></button></div><span class="muted">来源：钉钉 · 用服反馈流程</span></div><div class="toolbar"><input type="search" id="search" aria-label="搜索反馈" placeholder="搜索审批编号、问题描述、提交人或型号"><span id="resultCount" class="muted"></span></div><div id="list"><div class="empty">正在读取反馈…</div></div><div id="pages" class="pagination"></div></section>
<section class="panel detail" id="detail" hidden></section>
<footer class="footnote">同步只读取“用服反馈流程”。附件暂通过 OA 原单查看；本页不会自动同意审批、发送评论或创建正式任务。 <a href="/design/ma-workbench/">查看原交互设计稿</a></footer></main><div id="toast" role="status" hidden></div><script src="/ma-workbench/oa.js"></script></body></html>
